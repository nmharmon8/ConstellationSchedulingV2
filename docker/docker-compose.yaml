
services:
  ray-app:
    build:
      context: .
      dockerfile: Dockerfile.ray
    shm_size: '10.24gb' 
    network_mode: host
    volumes:
      - ../:/app
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    command: tail -f /dev/null 
